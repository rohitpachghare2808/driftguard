name: CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: flake8 app train.py quality_gate.py drift_check.py --max-line-length=100
      - run: python train.py
      - run: pytest
      - run: python quality_gate.py

  docker:
    needs: test-and-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/driftguard:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/driftguard:latest
