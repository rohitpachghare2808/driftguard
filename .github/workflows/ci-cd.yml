name: CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: flake8 app train.py quality_gate.py drift_check.py --max-line-length=100
      - run: python train.py
      - run: pytest
      - run: python quality_gate.py

  docker:
    needs: test-and-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/driftguard:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/driftguard:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Deploy new version to Render
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&imgURL=docker.io/${{ secrets.DOCKER_USERNAME }}/driftguard:${{ github.sha }}"
      - name: Smoke test (new commit must be live)
        run: |
          for i in $(seq 1 20); do
            echo "Attempt $i"
            if curl -fsS ${{ secrets.SERVICE_URL }}/health | grep -q "${{ github.sha }}"; then
              echo "New version is live and healthy"
              exit 0
            fi
            sleep 15
          done
          echo "New version did not become healthy"
          exit 1
      - name: Promote image to stable
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKER_USERNAME }}/driftguard:stable ${{ secrets.DOCKER_USERNAME }}/driftguard:${{ github.sha }}
      - name: Roll back to last stable image
        if: failure()
        run: |
          echo "Smoke test failed - rolling back to stable"
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&imgURL=docker.io/${{ secrets.DOCKER_USERNAME }}/driftguard:stable"
